<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="facade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  
  <!-- Landscaped Ground -->
  <rect y="400" width="800" height="100" fill="#15803d"/>
  <rect y="440" width="800" height="60" fill="#334155"/>

  <!-- Luxury Modern Villa / Building Structure -->
  <!-- Main Tower Block -->
  <rect x="220" y="100" width="360" height="300" fill="url(#facade)" rx="6"/>
  <!-- Cantilevered Overhang Floor 2 -->
  <rect x="180" y="180" width="440" height="110" fill="#0f172a" rx="4"/>
  
  <!-- Floor 2 Ribbon Windows / Balcony -->
  <rect x="200" y="195" width="400" height="75" fill="url(#glass)" rx="3"/>
  <line x1="280" y1="195" x2="280" y2="270" stroke="#f8fafc" stroke-width="2"/>
  <line x1="380" y1="195" x2="380" y2="270" stroke="#f8fafc" stroke-width="2"/>
  <line x1="480" y1="195" x2="480" y2="270" stroke="#f8fafc" stroke-width="2"/>

  <!-- Ground Floor Entrance & Double-Height Glass -->
  <rect x="250" y="290" width="140" height="110" fill="url(#glass)"/>
  <!-- Wood Accent Paneling -->
  <rect x="410" y="290" width="150" height="110" fill="#b45309"/>
  <!-- Architectural vertical slats -->
  <line x1="430" y1="290" x2="430" y2="400" stroke="#78350f" stroke-width="3"/>
  <line x1="450" y1="290" x2="450" y2="400" stroke="#78350f" stroke-width="3"/>
  <line x1="470" y1="290" x2="470" y2="400" stroke="#78350f" stroke-width="3"/>
  <line x1="490" y1="290" x2="490" y2="400" stroke="#78350f" stroke-width="3"/>
  <line x1="510" y1="290" x2="510" y2="400" stroke="#78350f" stroke-width="3"/>
  <line x1="530" y1="290" x2="530" y2="400" stroke="#78350f" stroke-width="3"/>

  <!-- Swimming Pool foreground -->
  <polygon points="60,420 220,420 200,470 30,470" fill="#06b6d4" opacity="0.85"/>

  <!-- Property Label Overlay -->
  <rect x="30" y="30" width="280" height="42" fill="#0f172a" rx="8" opacity="0.9"/>
  <text x="45" y="56" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">Asset ID #A-204 | Grade A+ RCC</text>
</svg>

