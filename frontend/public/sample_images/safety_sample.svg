<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  
  <!-- Crane Tower in background -->
  <rect x="680" y="50" width="16" height="350" fill="#f59e0b"/>
  <rect x="520" y="70" width="260" height="12" fill="#f59e0b"/>
  <line x1="688" y1="50" x2="560" y2="70" stroke="#f59e0b" stroke-width="3"/>
  <line x1="688" y1="50" x2="770" y2="70" stroke="#f59e0b" stroke-width="3"/>

  <!-- Concrete Structure & Deck -->
  <rect x="50" y="240" width="700" height="40" fill="url(#beam)"/>
  <rect x="90" y="280" width="60" height="200" fill="#475569"/>
  <rect x="360" y="280" width="60" height="200" fill="#475569"/>
  <rect x="630" y="280" width="60" height="200" fill="#475569"/>

  <!-- Scaffolding Frame -->
  <g stroke="#94a3b8" stroke-width="4">
    <line x1="180" y1="120" x2="180" y2="240"/>
    <line x1="280" y1="120" x2="280" y2="240"/>
    <line x1="180" y1="120" x2="280" y2="120"/>
    <line x1="180" y1="180" x2="280" y2="180"/>
    <line x1="180" y1="120" x2="280" y2="180"/>
    <line x1="180" y1="180" x2="280" y2="120"/>
    <!-- Missing Guardrail Zone marker -->
    <rect x="440" y="210" width="180" height="30" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="450" y="230" fill="#ef4444" font-family="sans-serif" font-weight="bold" font-size="12">MISSING GUARDRAIL</text>
  </g>

  <!-- Worker 1 on Deck with full PPE -->
  <g transform="translate(210, 140)">
    <!-- Helmet -->
    <path d="M 12 0 A 10 10 0 0 1 28 0 Z" fill="#eab308"/>
    <!-- Head -->
    <circle cx="20" cy="10" r="7" fill="#fcd34d"/>
    <!-- Vest & Body -->
    <rect x="13" y="17" width="14" height="25" fill="#f97316"/>
    <rect x="16" y="17" width="3" height="25" fill="#facc15"/>
    <rect x="21" y="17" width="3" height="25" fill="#facc15"/>
    <!-- Legs -->
    <rect x="14" y="42" width="5" height="20" fill="#1e3a8a"/>
    <rect x="21" y="42" width="5" height="20" fill="#1e3a8a"/>
    <!-- Boots -->
    <rect x="12" y="60" width="7" height="6" fill="#78350f"/>
    <rect x="21" y="60" width="7" height="6" fill="#78350f"/>
  </g>

  <!-- Worker 2 near unprotected edge (Missing harness) -->
  <g transform="translate(520, 180)">
    <!-- Helmet -->
    <path d="M 12 0 A 10 10 0 0 1 28 0 Z" fill="#eab308"/>
    <circle cx="20" cy="10" r="7" fill="#fed7aa"/>
    <rect x="13" y="17" width="14" height="25" fill="#0284c7"/>
    <rect x="14" y="42" width="5" height="20" fill="#334155"/>
    <rect x="21" y="42" width="5" height="20" fill="#334155"/>
  </g>

  <!-- High-voltage cable on ground -->
  <path d="M 100 440 Q 250 420 400 450 T 700 430" fill="none" stroke="#e11d48" stroke-width="6"/>
  <rect x="360" y="415" width="100" height="20" fill="#1e293b" rx="4"/>
  <text x="365" y="430" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold">TRIP HAZARD</text>

  <!-- Watermark / Label -->
  <rect x="20" y="20" width="300" height="36" fill="#0f172a" rx="8" opacity="0.85"/>
  <text x="35" y="43" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">OSHA Site Inspection Photo #0492</text>
</svg>

